<meta charset="utf-8">

<title>도움말 · BG3 책 열람실</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-row">
    <h1 data-t="title"></h1>
    <div class="head-tools"><a id="back" class="help-link" href="index.html" data-t="back"></a>
    <div class="ui-lang" role="group" aria-label="Language">
      <button type="button" data-ui="ko">한국어</button><button type="button" data-ui="en">English</button>
    </div></div>
  </div>
</header>
<main class="help">
  <h2 data-t="keys"></h2>
  <table>
    <tbody>
      <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td data-t="lr"></td></tr>
      <tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td data-t="ud"></td></tr>
      <tr><td><kbd>R</kbd></td><td data-t="r"></td></tr>
      <tr><td><kbd>F</kbd></td><td data-t="f"></td></tr>
      <tr><td><kbd>T</kbd></td><td data-t="t"></td></tr>
      <tr><td><kbd>E</kbd> <kbd>K</kbd></td><td data-t="ek"></td></tr>
    </tbody>
  </table>
  <p data-t="note"></p>
</main>
<script>
const T = {
  ko: {
    title: "도움말", back: "◀ 책 열람실로", keys: "키보드 단축키",
    lr: "이전 쪽·다음 쪽 (기본 책)", ud: "목록의 이전 책·다음 책 열기 (두루마리처럼 스크롤되는 글은 먼저 스크롤하고, 맨 위·맨 아래에서 책을 바꿈)", r: "읽음 표시·읽음 표시 해제", f: "즐겨찾기·즐겨찾기 해제", t: "기술 정보(발견 장소의 레벨·좌표와 지역 판정, 데이터 섹션) 표시·숨김. 상단의 \"기술 정보 표시\"·\"기술 정보 숨기기\" 버튼과 같고, 처음에는 숨겨져 있습니다.", ek: "책 본문을 영어로·한국어로 전환 (한국어 화면)",
    note: "검색창이나 필터 선택에 커서가 있을 때는 단축키가 작동하지 않습니다. 마우스 휠로도 기본 책의 쪽을 넘길 수 있습니다.",
    doc: "도움말 · BG3 책 열람실",
  },
  en: {
    title: "Help", back: "◀ Back to the library", keys: "Keyboard shortcuts",
    lr: "Previous / next page (books)", ud: "Open the previous / next book in the list (scrolling text such as scrolls scrolls first and changes the book at its top or bottom)", r: "Mark / unmark as read", f: "Add to / remove from favorites", t: "Show / hide technical info (level and coordinates and region match under Found at, and the Data section). Same as the \"Show technical info\" / \"Hide technical info\" button at the top; hidden at first.", ek: "Show the book text in English / Korean (Korean interface)",
    note: "Shortcuts are off while the search box or a filter has focus. The mouse wheel also turns the pages of a book.",
    doc: "Help · BG3 Book Library",
  },
};
let ui = new URLSearchParams(location.search).get("lang");
if (!T[ui]) { try { ui = localStorage.getItem("ui"); } catch (e) { /* storage blocked */ } }
if (!T[ui]) ui = "ko";
function applyUi() {
  document.documentElement.lang = ui;
  document.title = T[ui].doc;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[ui][el.dataset.t]));
  document.querySelectorAll("[data-ui]").forEach((b) => b.classList.toggle("on", b.dataset.ui === ui));
  document.getElementById("back").href = "index.html?lang=" + ui;
}
document.querySelectorAll("[data-ui]").forEach((b) => b.addEventListener("click", () => {
  ui = b.dataset.ui;
  try { localStorage.setItem("ui", ui); } catch (e) { /* storage blocked */ }
  applyUi();
}));
applyUi();
</script>
</body>
</html>
