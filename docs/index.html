<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BG3 책 열람실 · BG3 Book Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-row">
    <h1 data-i18n="title">BG3 책 열람실</h1>
    <div class="ui-lang" role="group" aria-label="Language">
      <button type="button" data-ui="ko">한국어</button><button type="button" data-ui="en">English</button>
    </div>
  </div>
  <p class="sub"><span data-i18n="sub"></span> <span id="total"></span></p>
</header>
<div class="layout">
  <aside class="filters">
    <input id="q" type="search" autocomplete="off">
    <label><span data-i18n="f-ty"></span> <select id="f-ty"></select></label>
    <label><span data-i18n="f-a"></span> <select id="f-a"></select></label>
    <label><span data-i18n="f-bg"></span> <select id="f-bg"></select></label>
    <label><span data-i18n="f-r"></span> <select id="f-r"></select></label>
    <label><span data-i18n="f-tg"></span> <select id="f-tg"></select></label>
    <button id="reset" type="button" data-i18n="reset"></button>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
  </aside>
  <main id="detail"></main>
</div>
<footer data-i18n="footer"></footer>
<script src="app.js"></script>
</body>
</html>
